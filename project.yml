name: MangaReader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  MangaReader:
    type: application
    platform: iOS
    sources: [App, Domain, Data, Features]
    dependencies:
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.mangareader.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MangaReader
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
